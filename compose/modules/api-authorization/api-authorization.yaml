    networks:
      - api-platform
    image: gcr.io/production-main-268117/api-authorization:CHANGE_HERE
    container_name: api-authorization
    mem_limit: 2048m
    restart: always
    ports:
      - '8084:8084'

networks:
  api-platform:
    name: api-platform

